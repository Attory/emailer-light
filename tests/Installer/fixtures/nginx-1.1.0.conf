server {
    listen 80;
    server_name mailer.example.test;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/emailer-acme; }
    access_log off;
    location / { return 301 https://mailer.example.test$request_uri; }
}
server {
    listen 443 ssl;
    server_name mailer.example.test;
    ssl_certificate /etc/letsencrypt/live/mailer.example.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mailer.example.test/privkey.pem;
    root /srv/emailer-light/releases/current/public;
    index index.php;
    access_log off;
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_pass unix:/run/emailer-light-fpm/php.sock;
    }
    location / { try_files $uri /index.php$is_args$args; }
    location ~ \\.php$ { return 404; }
    location ~ (^|/)\\. { return 404; }
    location ~* \\.(?:env|log|sql|dump|backup|bak|key|pem|p12|pfx)$ { return 404; }
}

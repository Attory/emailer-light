security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: argon2id
            time_cost: 4
            memory_cost: 65536

    providers:
        app_user_provider:
            id: App\Module\Identity\Infrastructure\DoctrineUserProvider

    firewalls:
        dev:
            pattern: ^/(?:_error|assets)/
            security: false
        recipient:
            pattern: ^/r/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Module\Identity\Infrastructure\LoginFormAuthenticator
            entry_point: App\Module\Identity\Infrastructure\LoginFormAuthenticator

    access_control:
        - { path: '^/health/live$', roles: PUBLIC_ACCESS }
        - { path: '^/setup(?:/|$)', roles: PUBLIC_ACCESS }
        - { path: '^/login$', roles: PUBLIC_ACCESS }
        - { path: '^/r(?:/|$)', roles: PUBLIC_ACCESS }
        - { path: '^/template-assets(?:/|$)', roles: PUBLIC_ACCESS }
        - { path: '^/admin(?:/|$)', roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10240

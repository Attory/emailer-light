name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }} / MariaDB ${{ matrix.mariadb }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.4.24
            mariadb: 10.11.19
            server_version: 10.11.19-MariaDB
          - php: 8.4.24
            mariadb: 11.8.9
            server_version: 11.8.9-MariaDB
          - php: 8.5.9
            mariadb: 10.11.19
            server_version: 10.11.19-MariaDB
          - php: 8.5.9
            mariadb: 11.8.9
            server_version: 11.8.9-MariaDB
    env:
      COMPOSE_PROJECT_NAME: emailer_light_ci
      PHP_VERSION: ${{ matrix.php }}
      MARIADB_IMAGE: mariadb:${{ matrix.mariadb }}
      MARIADB_SERVER_VERSION: ${{ matrix.server_version }}
      DATABASE_URL: mysql://emailer:local-only@database:3306/emailer_test?serverVersion=${{ matrix.server_version }}&charset=utf8mb4

    steps:
      - name: Check out Emailer Light source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify installer configuration and hosting isolation contracts
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/Installer
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/Installer
          python3 tools/docs/check-guides.py

      - name: Prepare writable generated-output directories
        run: sudo install -d -o 1000 -g 1000 -m 0755 build .cache public/template-assets

      - name: Build locked PHP application image
        run: docker compose build --pull app

      - name: Verify SMTP TLS, authentication and explicit-send isolation
        run: EMAILER_SMTP_PROBE_IMAGE="${COMPOSE_PROJECT_NAME}-app:latest" bash tools/installer/check-smtp-probe.sh

      - name: Start MariaDB and Mailpit
        run: docker compose up --detach --wait database mailpit

      - name: Refresh vendor volume from clean image install
        run: |
          docker compose run --rm --no-deps app sh -euc '
              find vendor -mindepth 1 -depth -delete
              cp -a /opt/emailer-vendor/. vendor/
          '

      - name: Run Light quality, license, migration, test and artifact gates
        run: docker compose run --rm app composer check

      - name: Verify root-controlled incomplete-draft migration and recovery
        run: docker compose run --rm --user root app php bin/phpunit --do-not-cache-result tests/Integration/Light/CampaignDraftSchemaPlanTest.php

      - name: Verify root-run backup copy and update-journal custody
        run: docker compose run --rm --user root app php bin/phpunit --do-not-cache-result tests/Module/Backup/RootBackupCopyTest.php tests/Module/Health/UpdateDeliveryStateTest.php

      - name: Verify operation-owned delivery controls and crash boundaries
        run: >-
          docker compose run --rm --user root
          -e EMAILER_CONTROL_DATABASE_FIXTURE=1
          -e "DATABASE_URL=mysql://root:local-root-only@database:3306/emailer_test?serverVersion=${MARIADB_SERVER_VERSION}&charset=utf8mb4"
          app php bin/phpunit --do-not-cache-result tests/Module/Delivery

      - name: Repeat test suite with external egress disabled
        run: bash tools/ci/run-network-isolated-tests.sh

      - name: Install the pinned editor browser test toolchain
        if: matrix.php == '8.4.24' && matrix.mariadb == '10.11.19'
        working-directory: tools/browser
        run: |
          npm ci --ignore-scripts
          node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Verify the complete editor workflow and actual isolated SMTP delivery
        if: matrix.php == '8.4.24' && matrix.mariadb == '10.11.19'
        run: |
          export EMAILER_BROWSER_PHP_IMAGE="${COMPOSE_PROJECT_NAME}-app:latest"
          export EMAILER_CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("./tools/browser/node_modules/playwright-core").chromium.executablePath())')"
          export EMAILER_BROWSER_OUTPUT="${GITHUB_WORKSPACE}/build/browser-results"
          sudo --preserve-env=EMAILER_BROWSER_PHP_IMAGE,EMAILER_CHROMIUM_EXECUTABLE,EMAILER_BROWSER_OUTPUT python3 tools/browser/run-isolated.py

      - name: Inspect resulting diff
        run: git diff --check

      - name: Stop ephemeral services
        if: always()
        run: docker compose down --volumes --remove-orphans
